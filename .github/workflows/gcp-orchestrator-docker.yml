name: Build and Push GCP Orchestrator Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./functions/gcp_orchestrator
          push: true
          tags: |
            australia-southeast1-docker.pkg.dev/ecolens-497810/ecolens-repo/ecolens-orchestrator:${{ github.sha }}
            australia-southeast1-docker.pkg.dev/ecolens-497810/ecolens-repo/ecolens-orchestrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # - name: Deploy to Cloud Run
      #   run: |
      #     gcloud run services update aussie-ecolens-prod-orchestrator \
      #       --region=australia-southeast1 \
      #       --image=australia-southeast1-docker.pkg.dev/ecolens-497810/ecolens-repo/ecolens-orchestrator:${{ github.sha }}